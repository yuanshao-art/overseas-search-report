function fmtVol(v) { return v >= 10000 ? (v/10000).toFixed(1)+'万' : Math.round(v).toLocaleString(); }
function fmtWow(v) { return (v*100).toFixed(1)+'%'; }
function fmtYoy(v) { return Math.round(v*100)+'%'; }

const COLORS = {
  grid:'#f0f3f9', axisLabel:'#8a9ab8', axisLine:'#e0e6f0',
  jk:'#ee4d7e', sea:'#00b887', eu:'#6a5aee', oth:'#f5a623',
};
const BASE = {
  backgroundColor:'transparent',
  textStyle:{ color:'#4a5a7a', fontFamily:'PingFang SC, Microsoft YaHei, sans-serif' },
  tooltip:{
    backgroundColor:'#fff', borderColor:'#dde5f8', borderWidth:1,
    textStyle:{ color:'#1a2340', fontSize:12 },
    extraCssText:'box-shadow:0 4px 16px rgba(0,0,0,0.10);border-radius:8px;',
  }
};

function makeBarChart(domId, data) {
  // 全量城市，dataZoom 控制视窗（默认显示前20个）
  const allData = [...data].sort((a,b)=>b.vol-a.vol);
  const cities = allData.map(d => d.city);
  const vols = allData.map(d => Math.round(d.vol));
  const yoys = allData.map(d => Math.round(d.yoy*100));
  const total = allData.length;
  const showCount = 20;
  const endPct = Math.round(showCount / total * 100);
  const chart = echarts.init(document.getElementById(domId));
  chart.setOption({
    ...BASE,
    grid:{ top:60, bottom:100, left:20, right:70, containLabel:true },
    dataZoom:[
      {
        type:'slider',
        xAxisIndex:0,
        start:0, end:endPct,
        height:20,
        bottom:14,
        borderColor:'#e0e6f0',
        fillerColor:'rgba(59,110,248,0.10)',
        handleStyle:{ color:'#3b6ef8', borderColor:'#3b6ef8' },
        textStyle:{ color:'#8a9ab8', fontSize:10 },
        labelFormatter: (val) => {
          const i = Math.round(val / 100 * (total - 1));
          return cities[i] || '';
        },
      },
      {
        type:'inside',
        xAxisIndex:0,
        start:0, end:endPct,
        zoomOnMouseWheel:false,
        moveOnMouseMove:true,
        moveOnMouseWheel:true,
      }
    ],
    xAxis:{
      type:'category', data:cities,
      axisLabel:{ color:COLORS.axisLabel, fontSize:11, rotate:35, interval:0, margin:10 },
      axisLine:{ lineStyle:{ color:COLORS.axisLine } }, axisTick:{ show:false },
    },
    yAxis:[
      {
        type:'value', name:'搜索量',
        nameTextStyle:{ color:COLORS.axisLabel, fontSize:11, padding:[0,0,0,-20] },
        axisLabel:{ color:COLORS.axisLabel, fontSize:10, formatter: v => v>=10000?(v/10000).toFixed(0)+'万':v },
        splitLine:{ lineStyle:{ color:COLORS.grid, type:'dashed' } },
        axisLine:{ show:false }, axisTick:{ show:false },
      },
      {
        type:'value', name:'年同比',
        nameTextStyle:{ color:'#ff5c72', fontSize:11 },
        axisLabel:{ color:'#ff5c72', fontSize:10, formatter:'{value}%' },
        splitLine:{ show:false }, axisLine:{ show:false }, axisTick:{ show:false },
      }
    ],
    series:[
      {
        name:'搜索量', type:'bar', data:vols, yAxisIndex:0,
        barMaxWidth:22,
        itemStyle:{
          color:()=>new echarts.graphic.LinearGradient(0,0,0,1,[
            {offset:0,color:'rgba(100,136,250,0.95)'},{offset:1,color:'rgba(59,110,248,0.85)'}
          ]),
          borderRadius:[4,4,0,0],
        },
        label:{
          show:true, position:'top', fontSize:9, color:'#6b7fa8',
          formatter: params => fmtVol(allData[params.dataIndex].vol),
        },
      },
      {
        name:'年同比', type:'line', data:yoys, yAxisIndex:1,
        smooth:true, lineStyle:{ color:'#ff5c72', width:2.5 },
        itemStyle:{ color:'#ff5c72', borderColor:'#fff', borderWidth:2 },
        symbol:'circle', symbolSize:6,
        label:{
          show:true, fontSize:9, fontWeight:'600',
          color:params=>params.value>=0?'#009966':'#dd3333',
          formatter:params=>params.value+'%',
          position:'top', distance:5,
        },
      }
    ],
    tooltip:{
      ...BASE.tooltip, trigger:'axis',
      axisPointer:{ type:'shadow', shadowStyle:{ color:'rgba(59,110,248,0.05)' } },
      formatter:params=>{
        const d=allData.find(x=>x.city===params[0].axisValueLabel); if(!d) return params[0].axisValueLabel;
        return `<div style="font-weight:600;margin-bottom:4px;">${d.city}</div>`
          +`<div>搜索量：<b>${fmtVol(d.vol)}</b></div>`
          +`<div>周环比：<b style="color:${d.wow>=0?'#00aa6c':'#f54b4b'}">${fmtWow(d.wow)}</b></div>`
          +`<div>年同比：<b style="color:${d.yoy>=0?'#00aa6c':'#f54b4b'}">${fmtYoy(d.yoy)}</b></div>`;
      }
    }
  });
  return chart;
}


function makeBubbleChart(domId, data) {
  const top50 = data.slice(0,50);
  const maxVol = Math.max(...top50.map(d=>d.vol));
  const rColors = {japan_korea:COLORS.jk, sea:COLORS.sea, europe:COLORS.eu, others:COLORS.oth};
  const rNames = {japan_korea:'日韩', sea:'东南亚', europe:'欧洲', others:'其他'};
  const seriesMap = {};
  ['japan_korea','sea','europe','others'].forEach(r=>seriesMap[r]=[]);
  top50.forEach(d=>{
    seriesMap[d.region].push({value:[+(d.wow*100).toFixed(1),Math.round(d.yoy*100)], name:d.city, symbolSize:Math.round(d.vol/maxVol*48+8)});
  });
  const series = Object.keys(seriesMap).map(r=>({
    name:rNames[r], type:'scatter', data:seriesMap[r],
    itemStyle:{color:rColors[r], opacity:0.75, borderColor:'#fff', borderWidth:1.5},
    label:{show:true, formatter:p=>p.name, fontSize:11, color:'#3a4a6a', position:'right', distance:4},
    emphasis:{itemStyle:{opacity:1, shadowBlur:8, shadowColor:rColors[r]}},
  }));
  const chart = echarts.init(document.getElementById(domId));
  chart.setOption({
    ...BASE,
    legend:{ data:Object.values(rNames), textStyle:{color:'#6b7fa8',fontSize:12}, top:8, right:16, itemWidth:10, itemHeight:10 },
    grid:{ top:44, bottom:56, left:60, right:40 },
    xAxis:{
      type:'value', name:'周环比 %', nameTextStyle:{color:COLORS.axisLabel,fontSize:11}, nameLocation:'end',
      axisLabel:{color:COLORS.axisLabel, formatter:v=>v+'%'},
      splitLine:{lineStyle:{color:COLORS.grid,type:'dashed'}},
      axisLine:{lineStyle:{color:COLORS.axisLine}}, axisTick:{show:false},
    },
    yAxis:{
      type:'value', name:'年同比 %', nameTextStyle:{color:COLORS.axisLabel,fontSize:11},
      axisLabel:{color:COLORS.axisLabel, formatter:v=>v+'%'},
      splitLine:{lineStyle:{color:COLORS.grid,type:'dashed'}},
      axisLine:{lineStyle:{color:COLORS.axisLine}}, axisTick:{show:false},
    },
    series:[
      {type:'line', data:[], markLine:{silent:true, symbol:'none', lineStyle:{type:'dashed',color:'#c8d4e8',width:1}, label:{show:false}, data:[{xAxis:0},{yAxis:0}]}},
      ...series,
    ],
    tooltip:{
      ...BASE.tooltip, trigger:'item',
      formatter:p=>{
        const d=top50.find(x=>x.city===p.name); if(!d) return p.name;
        return `<div style="font-weight:600;margin-bottom:4px;">${d.city}</div>`
          +`<div>搜索量：<b>${fmtVol(d.vol)}</b></div>`
          +`<div>周环比：<b style="color:${d.wow>=0?'#00aa6c':'#f54b4b'}">${fmtWow(d.wow)}</b></div>`
          +`<div>年同比：<b style="color:${d.yoy>=0?'#00aa6c':'#f54b4b'}">${fmtYoy(d.yoy)}</b></div>`;
      }
    }
  });
  return chart;
}

    grid:{ top:30, bottom:64, left:12, right:48, containLabel:true },
    xAxis:{
      type:'category', data:cities,
      axisLabel:{color:COLORS.axisLabel, fontSize:10, rotate:38, interval:0},
      axisLine:{lineStyle:{color:COLORS.axisLine}}, axisTick:{show:false},

    yAxis:[
      {
        type:'value', name:'搜索量', nameTextStyle:{color:COLORS.axisLabel,fontSize:9},

        splitLine:{lineStyle:{color:COLORS.grid,type:'dashed'}}, axisLine:{show:false}, axisTick:{show:false},

        type:'value', name:'年同比', nameTextStyle:{color:'#ff5c72',fontSize:9},
        axisLabel:{color:'#ff5c72', fontSize:9, formatter:'{value}%'},
        splitLine:{show:false}, axisLine:{show:false}, axisTick:{show:false},
      }
    ],
    series:[
      {
        name:'搜索量', type:'bar', data:vols, yAxisIndex:0, barMaxWidth:18,

          color:()=>new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:color+'dd'},{offset:1,color:color+'88'}]),
          borderRadius:[3,3,0,0],
        },
      },
      {
        name:'年同比', type:'line', data:yoys, yAxisIndex:1,

      }
    }
  });
  return chart;
}
